name: medicalapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:

  flutter:
    sdk: flutter
  intl: any
  firebase_storage: ^13.0.0
  cupertino_icons: ^1.0.8
  cloud_firestore: ^6.5.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  gap: ^3.0.1
  dio: ^5.9.0
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.1
  equatable: ^2.0.5
  dartz: ^0.10.1
  get_it: ^7.7.0
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  google_sign_in: ^6.2.1
  carousel_slider: ^5.1.1
  image_picker: ^1.2.3
  easy_localization: ^3.0.7
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
